<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="test1.css">
</head>
<body>
    <section class="contact-section">
        <div class="contact-container">
            <div class="contact-content">
                <h1 class="contact-title">Contact me</h1>
                <p class="contact-description">
                    If you have an application you are interested in developing, a feature that you need built or a project that needs coding. I'd love to help with it.
                </p>
                
                <form class="contact-form">
                    <div class="form-group">
                        <input type="text" class="form-input" placeholder="Njobe Loveline" required>
                    </div>
                    
                    <div class="form-group">
                        <input type="email" class="form-input" placeholder="njobelovelinenkeni@gmail.com" required>
                    </div>
                    
                    <div class="form-group">
                        <textarea class="form-textarea" placeholder="Write your message here" rows="5" required></textarea>
                    </div>
                    
                    <button type="submit" class="submit-btn">Get in touch</button>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
